plugins {
    id 'fabric-loom' version '1.10.5'
    id 'java-library'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '2.0.0-beta.2'
    id 'com.diffplug.spotless' version '7.0.2'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_artifact_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

def runDirectory = providers.gradleProperty('run_directory').orElse('run').get()

sourceSets {
    main {
        java {
            srcDir 'src/integration/dye_depot/java'
            srcDir 'src/integration/arts_and_crafts/java'
        }
        resources {
            srcDir 'src/generated/resources'
            srcDir 'src/integration/dye_depot/resources'
            srcDir 'src/integration/arts_and_crafts/resources'
            exclude '.cache/'
        }
    }
}

loom {
    accessWidenerPath = file('src/main/resources/create_dragons_plus.accesswidener')

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            runDir runDirectory
        }
        server {
            server()
            runDir "${runDirectory}/server"
            programArg '--nogui'
        }
        datagen {
            client()
            name 'Data Generation'
            runDir "${runDirectory}/datagen"
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/generated/resources')}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            vmArg "-Dporting_lib.datagen.existing_resources=${file('src/main/resources')}"
            vmArg "-Dcreate_dragons_plus.datagen.translations=${file('src/main/translations')}"
        }
        configureEach {
            vmArg '-XX:+AllowEnhancedClassRedefinition'
            vmArg '-XX:+IgnoreUnrecognizedVMOptions'
            property 'mixin.debug.export', 'true'
        }
    }
}

repositories {
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://mvn.devos.one/snapshots' }
    maven { url = 'https://mvn.devos.one/releases' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven' }
    maven { url = 'https://maven.jamieswhiteshirt.com/libs-release' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.dragons.plus/releases' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings {
            nameSyntheticMembers = false
        }
        parchment "org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip"
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation("com.simibubi.create:create-fabric:${create_fabric_version}")

    implementation "io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"

    modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") {
        transitive = false
    }
    if (!providers.gradleProperty('without_jei').isPresent()) {
        modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") {
            transitive = false
        }
    }
    if (providers.gradleProperty('with_dye_depot').isPresent()) {
        modLocalRuntime("maven.modrinth:dl88rsIq:${dye_depot_test_version}") {
            transitive = false
        }
    }
    if (providers.gradleProperty('with_arts_and_crafts').isPresent()) {
        modLocalRuntime("maven.modrinth:artsandcrafts:${arts_and_crafts_test_version}") {
            transitive = false
        }
        // Arts & Crafts declares Jankson as a nested plain library. Loom keeps the
        // nested jar during remapping, but Fabric's development launcher does not
        // expose its classes, so mirror it on the test runtime classpath.
        runtimeOnly 'blue.endless:jankson:1.2.3'
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description,
            mod_github           : mod_github,
            mod_logo             : mod_logo,
            create_version_range : create_version_range,
            jei_version          : jei_version,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    from 'LICENSING.txt'
    from 'LICENSE.txt'
    from 'LICENSE-CREATE.txt'
    exclude '.cache'
}

spotless {
    java {
        endWithNewline()
        leadingTabsToSpaces()
        removeUnusedImports()
        toggleOffOn()
        importOrder()
        eclipse().configFile 'codeformat/formatter-config.xml'
        licenseHeaderFile 'codeformat/HEADER.txt'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_artifact_id
            from components.java
        }
    }
    repositories {
        maven {
            name = 'DragonsPlus'
            url = 'https://maven.dragons.plus/releases'
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

publishMods {
    file = remapJar.archiveFile
    additionalFiles.from remapSourcesJar.archiveFile
    changelog = project.file('CHANGELOG.md').text
    version = mod_version
    type = ALPHA
    displayName = "Create: Dragons Plus ${mod_version} for Create Fabric ${minecraft_version}-${create_version_production}"
    modLoaders.add('fabric')

    curseforge {
        projectId = '1216624'
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(minecraft_version)
        requires('fabric-api', 'create-fabric')
        optional('jei', 'dye-depot', 'artsandcrafts')
        client = true
        server = true
    }

    modrinth {
        projectId = 'dzb1a5WV'
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        minecraftVersions.add(minecraft_version)
        requires('fabric-api', 'create-fabric')
        optional('jei', 'dye-depot', 'artsandcrafts')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
