name: Fabric Build and Compatibility Matrix

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper Integrity
        uses: gradle/actions/wrapper-validation@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build -Pwithout_jei

      - name: Start dedicated server
        run: ./gradlew runServerSmoke -Pwithout_jei

      - name: Verify deterministic datagen (pass 1)
        run: ./gradlew runDatagen -Pwithout_jei && git diff --exit-code -- src/generated/resources

      - name: Verify deterministic datagen (pass 2)
        run: ./gradlew runDatagen -Pwithout_jei && git diff --exit-code -- src/generated/resources

      - name: Generate Maven publication metadata
        run: ./gradlew generatePomFileForMavenJavaPublication

      - name: Mod-platform publication dry run
        run: ./gradlew publishMods --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

  gametest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - name: base
            args: -Pwithout_jei
          - name: dye-depot
            args: -Pwithout_jei -Pwith_dye_depot
          - name: arts-and-crafts
            args: -Pwithout_jei -Pwith_arts_and_crafts
          - name: both-integrations
            args: -Pwithout_jei -Pwith_dye_depot -Pwith_arts_and_crafts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/wrapper-validation@v3
      - run: chmod +x ./gradlew
      - name: Run ${{ matrix.profile.name }} GameTests
        run: ./gradlew runGametestServer ${{ matrix.profile.args }}

  client-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - name: without-jei
            task: runClientSmoke
            args: -Pwithout_jei
          - name: with-jei
            task: runClientJeiSmoke
            args: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/wrapper-validation@v3
      - run: chmod +x ./gradlew
      - name: Start client ${{ matrix.profile.name }}
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: xvfb-run -a ./gradlew ${{ matrix.profile.task }} ${{ matrix.profile.args }}
