name: Fabric Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper Integrity
        uses: gradle/actions/wrapper-validation@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build -Pwithout_jei

      - name: Verify deterministic datagen (pass 1)
        run: |
          ./gradlew runDatagen -Pwithout_jei
          git diff --exit-code -- src/generated/resources
          test -z "$(git ls-files --others --exclude-standard -- src/generated/resources)"

      - name: Verify deterministic datagen (pass 2)
        run: |
          ./gradlew runDatagen -Pwithout_jei
          git diff --exit-code -- src/generated/resources
          test -z "$(git ls-files --others --exclude-standard -- src/generated/resources)"

      - name: Generate Maven publication metadata
        run: ./gradlew generatePomFileForMavenJavaPublication

      - name: Mod-platform publication dry run
        run: ./gradlew publishMods --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
